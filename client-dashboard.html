<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
  <title>Portal do Cliente | Neural X</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Portal do Cliente</h1>
      <div id="userInfo">
        <strong id="userName">Cliente</strong>
        <span id="userEmail"></span>
      </div>
    </header>

    <section id="orderSection">
      <h2>Seu pedido</h2>
      <div id="orderCard" class="card">
        <div class="product-image">
          <img id="productImage" src="/assets/placeholder.png" alt="Imagem do produto" />
        </div>
        <div class="product-info">
          <p><strong id="productName">-</strong></p>
          <p>Status: <span id="productStatus">-</span></p>
          <p>Valor: <span id="productPrice">-</span></p>
        </div>
      </div>

      <div class="image-upload">
        <label for="photoInput">Enviar foto do comprovante / imagem:</label>
        <input type="file" id="photoInput" accept="image/*" />
        <div id="photoPreview"></div>
      </div>
    </section>

    <button id="logout">Sair</button>
  </main>

  <script>
    // Redirect to login if not authenticated as client
    const role = sessionStorage.getItem('neuralx_role');
    const email = sessionStorage.getItem('neuralx_email') || '';
    if (role !== 'client') {
      window.location.assign('./client-login.html');
    }

    document.getElementById('userEmail').textContent = email;

    async function loadOrder() {
      try {
        const res = await fetch('/api/orders');
        if (!res.ok) throw new Error('failed');
        const orders = await res.json();
        const order = Array.isArray(orders) && orders.length ? orders[0] : null;
        if (!order) return;
        document.getElementById('productName').textContent = order.product || '-';
        document.getElementById('productStatus').textContent = order.status || '-';
        document.getElementById('productPrice').textContent = order.price ? new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(order.price) : 'R$ 0,00';
        // if product has image field use it
        if (order.image) document.getElementById('productImage').src = order.image;
      } catch (e) {
        console.error('Could not load order', e);
      }
    }

    document.getElementById('photoInput').addEventListener('change', (ev) => {
      const file = ev.target.files && ev.target.files[0];
      const preview = document.getElementById('photoPreview');
      preview.innerHTML = '';
      if (!file) return;
      const img = document.createElement('img');
      img.alt = 'Pré-visualização';
      img.style.maxWidth = '300px';
      img.style.maxHeight = '300px';
      const reader = new FileReader();
      reader.onload = () => {
        img.src = reader.result;
        preview.appendChild(img);
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('logout').addEventListener('click', () => {
      sessionStorage.removeItem('neuralx_role');
      sessionStorage.removeItem('neuralx_email');
      window.location.assign('./client-login.html');
    });

    loadOrder();
  </script>
</body>
</html>
