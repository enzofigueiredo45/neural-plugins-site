<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#020305" />
    <title>Área do Cliente | Neural X</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html"><span>Neural</span> X</a>
      <nav aria-label="Navegação principal">
        <a href="./index.html#produtos">Produtos</a>
        <a href="./cart.html">Carrinho <span id="cartCount" class="cart-count">0</span></a>
        <a href="./contact.html">Suporte</a>
      </nav>
    </header>

    <main class="section dashboard-page">
      <section class="dashboard-hero" aria-labelledby="dashboard-title">
        <div class="profile-card">
          <div class="avatar" id="avatarPreview" aria-hidden="true">NX</div>
          <div>
            <p class="eyebrow">Área do cliente</p>
            <h1 id="dashboard-title">Meus produtos</h1>
            <p class="lead">Veja seu perfil, pedidos comprados, status de entrega e links de acesso.</p>
          </div>
        </div>
        <button class="button secondary" id="logout" type="button">Sair</button>
      </section>

      <section class="dashboard-grid">
        <form class="checkout-box profile-form" id="profileForm">
          <p class="eyebrow">Perfil</p>
          <div class="field-group">
            <label for="profileName">Nome</label>
            <input id="profileName" name="name" type="text" autocomplete="name" placeholder="Seu nome" />
          </div>
          <div class="field-group">
            <label for="profileEmail">E-mail</label>
            <input id="profileEmail" name="email" type="email" disabled />
          </div>
          <div class="field-group">
            <label for="profileAvatar">URL da foto</label>
            <input id="profileAvatar" name="avatarUrl" type="text" placeholder="https://..." />
          </div>
          <p id="profileMessage" class="form-message" role="status" aria-live="polite"></p>
          <button class="button primary" type="submit">Salvar perfil</button>
        </form>

        <section class="checkout-box orders-panel" aria-labelledby="orders-title">
          <p class="eyebrow">Pedidos</p>
          <h2 id="orders-title">Produtos comprados</h2>
          <div id="ordersList" class="orders-list" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
