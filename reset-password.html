<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#11110f"><meta name="robots" content="noindex,nofollow">
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Nova senha | Neural X</title><link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a><header class="site-header"><div class="header-inner"><a class="brand" href="./index.html"><span class="brand-mark">NX</span><span class="brand-name">Neural X</span></a><div class="header-actions"><a class="header-link" href="./contact.html">Suporte</a></div></div></header>
    <main class="container auth-page" id="conteudo"><section class="auth-shell" aria-labelledby="reset-title"><div class="auth-copy"><p class="eyebrow">Link de uso único</p><h1 id="reset-title">Crie uma nova senha.</h1><p class="lead">Ao concluir, as sessões anteriores serão revogadas para proteger sua conta.</p></div><form class="form-card form-grid" id="resetPasswordForm" novalidate><div><p class="eyebrow">Nova credencial</p><h2>Redefinir senha</h2></div><div class="field-group"><label for="resetPassword">Nova senha</label><div class="password-wrap"><input id="resetPassword" name="newPassword" type="password" required autocomplete="new-password" minlength="12" maxlength="128"><button class="password-toggle" type="button" data-password-toggle="resetPassword" aria-label="Mostrar senha">Mostrar</button></div><small class="field-hint">Use maiúscula, minúscula, número e símbolo.</small></div><div class="field-group"><label for="resetPasswordConfirm">Confirmar nova senha</label><div class="password-wrap"><input id="resetPasswordConfirm" name="confirmPassword" type="password" required autocomplete="new-password" minlength="12" maxlength="128"><button class="password-toggle" type="button" data-password-toggle="resetPasswordConfirm" aria-label="Mostrar senha">Mostrar</button></div></div><p id="resetPasswordMessage" class="form-message" role="status" aria-live="polite"></p><button class="button primary" type="submit">Salvar nova senha</button><p class="form-footer"><a class="inline-link" href="./client-login.html">Voltar ao login</a></p></form></section></main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
