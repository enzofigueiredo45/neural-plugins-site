    <radialGradient id="glow"><stop stop-color="#d8ff3e" stop-opacity=".38"/><stop offset="1" stop-color="#d8ff3e" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1200" height="900" rx="48" fill="url(#bg)"/>
