<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Interface de produção musical Neural X</title>
  <desc id="desc">Composição abstrata com amplificador virtual, pedais, medidores e formas de onda.</desc>
  <defs>
