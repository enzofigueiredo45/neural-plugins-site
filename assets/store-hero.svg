    <g fill="#f5f7f2" font-family="Arial,sans-serif" font-size="17" text-anchor="middle"><text x="220" y="452">INPUT</text><text x="350" y="452">DRIVE</text><text x="480" y="452">TONE</text><text x="610" y="452">OUTPUT</text></g>
    <rect x="720" y="330" width="280" height="145" rx="18" fill="#08090b" stroke="#333840"/>
