<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#11110f"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">

    <title>Confirmar e-mail | Neural X</title><link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="site-header"><div class="header-inner"><a class="brand" href="./index.html"><span class="brand-mark">NX</span><span class="brand-name">Neural X</span></a></div></header>
    <main class="container auth-page" id="conteudo">
      <section class="auth-shell" aria-labelledby="verification-title">
        <div class="auth-copy"><p class="eyebrow">Proteção da conta</p><h1 id="verification-title">Confirme seu e-mail.</h1><p class="lead">Essa etapa impede que outra pessoa acesse pedidos, chamados ou links apenas por conhecer seu endereço.</p></div>
        <div class="form-card auth-form">
          <p id="verifyEmailMessage" class="form-message" role="status" aria-live="polite">Verificando o link…</p>
          <a class="button primary" id="verifyEmailContinue" href="./client-dashboard.html" hidden>Abrir minha conta</a>
          <a class="inline-link" href="./client-login.html">Voltar ao login</a>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
